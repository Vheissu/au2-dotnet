name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: npm ci
      - run: dotnet restore --locked-mode
      - run: dotnet tool restore
      - run: npm run format:check
      - run: npm run check
      - name: Check generated contracts
        run: |
          npm run api:types
          git diff --exit-code -- src/Starter.Web/src/api/generated/schema.d.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Build container
        run: docker build -t au2-dotnet:ci .
      - name: Smoke test container as non-root
        run: |
          docker run --detach --rm --name starter --publish 127.0.0.1:8080:8080 --env Database__ApplyMigrations=true au2-dotnet:ci
          trap 'docker logs starter; docker stop starter' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8080/health
          curl --fail http://127.0.0.1:8080/guide
          curl --fail --header 'Content-Type: application/json' --data '{"title":"Container smoke test"}' http://127.0.0.1:8080/api/work-items
